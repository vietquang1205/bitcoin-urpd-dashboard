# Đặt file này tại: .github/workflows/update-data.yml
# Tự lấy dữ liệu BTC mỗi ngày và commit vào repo. Dashboard Streamlit chỉ đọc các file này.
name: Update BTC data

on:
  schedule:
    - cron: "23 1,9,17 * * *"   # 08:23, 16:23, 00:23 giờ Việt Nam
  workflow_dispatch:             # cho phép bấm "Run workflow" chạy tay

permissions:
  contents: write

concurrency:
  group: update-btc-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Luôn lấy code MỚI NHẤT của nhánh main (kể cả khi bấm "Re-run" một lần chạy cũ)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install requests pandas numpy plotly streamlit

      - name: Lấy dữ liệu
        env:
          RESEARCHBITCOIN_API_TOKEN: ${{ secrets.RESEARCHBITCOIN_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python app.py --update-data

      - name: Lấy dữ liệu NEAR
        continue-on-error: true          # NEAR lỗi cũng không chặn việc lưu dữ liệu BTC
        env:
          NEARBLOCKS_API_KEY: ${{ secrets.NEARBLOCKS_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEAR_HOLDINGS: ${{ secrets.NEAR_HOLDINGS }}
        run: python pages/NEAR_Monitor.py --update-data

      # Chỉ GitHub Actions ghi các file dữ liệu này, nên bản vừa tạo luôn là bản đúng:
      # cất ra ngoài → đồng bộ với main mới nhất → chép lại → commit. Không bị conflict.
      - name: Commit dữ liệu mới
        run: |
          FILES="urpd_history.json researchbitcoin_daily_history.json bgeometrics_realized_pl_history.json bgeometrics_onchain_history.json update_status.json near_history.json"
          BRANCH="${{ github.event.repository.default_branch }}"
          mkdir -p "$RUNNER_TEMP/data"
          for f in $FILES; do
            if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/data/"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            for f in $FILES; do
              if [ -f "$RUNNER_TEMP/data/$f" ]; then cp "$RUNNER_TEMP/data/$f" "$f"; git add "$f"; fi
            done
            if git diff --cached --quiet; then
              echo "Không có dữ liệu mới."
              exit 0
            fi
            git commit -m "Update BTC data $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push lỗi, thử lại ($attempt)..."
            sleep 5
          done
          exit 1
